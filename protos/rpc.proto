syntax = "proto3";

package protobuf;

import "google/protobuf/timestamp.proto";
import "types.proto";

option go_package = "internal/container/agent/pb";

service AgentService {
  rpc ListContainers(ListContainersRequest) returns (ListContainersResponse) {}
  rpc FindContainer(FindContainerRequest) returns (FindContainerResponse) {}
  rpc StreamLogs(StreamLogsRequest) returns (stream StreamLogsResponse) {}
  rpc LogsBetweenDates(LogsBetweenDatesRequest) returns (stream StreamLogsResponse) {}
  rpc StreamRawBytes(StreamRawBytesRequest) returns (stream StreamRawBytesResponse) {}
  rpc StreamEvents(StreamEventsRequest) returns (stream StreamEventsResponse) {}
  rpc StreamStats(StreamStatsRequest) returns (stream StreamStatsResponse) {}
  rpc StreamContainerStarted(StreamContainerStartedRequest) returns (stream StreamContainerStartedResponse) {}
  rpc HostInfo(HostInfoRequest) returns (HostInfoResponse) {}
  rpc ContainerAction(ContainerActionRequest) returns (ContainerActionResponse) {}
  rpc UpdateContainer(UpdateContainerRequest) returns (stream UpdateContainerProgress) {}
  rpc RollbackContainer(RollbackContainerRequest) returns (stream UpdateContainerProgress) {}
  rpc CheckImageUpdate(CheckImageUpdateRequest) returns (CheckImageUpdateResponse) {}
  rpc ContainerExec(stream ContainerExecRequest) returns (stream ContainerExecResponse) {}
  rpc ContainerAttach(stream ContainerAttachRequest) returns (stream ContainerAttachResponse) {}
  rpc UpdateNotificationConfig(UpdateNotificationConfigRequest) returns (UpdateNotificationConfigResponse) {}
  rpc UpdateCloudConfig(UpdateCloudConfigRequest) returns (UpdateCloudConfigResponse) {}
  rpc GetNotificationStats(GetNotificationStatsRequest) returns (GetNotificationStatsResponse) {}
  rpc LogHistogram(LogHistogramRequest) returns (LogHistogramResponse) {}
  rpc RecentUpdates(RecentUpdatesRequest) returns (RecentUpdatesResponse) {}
  rpc StreamUpdates(StreamUpdatesRequest) returns (stream StreamUpdatesResponse) {}
}

message ListContainersRequest {
  map<string, RepeatedString> filter = 1;
}

message RepeatedString {
  repeated string values = 1;
}

message ListContainersResponse {
  repeated Container containers = 1;
}

message FindContainerRequest {
  string containerId = 1;
  map<string, RepeatedString> filter = 2;
}

message FindContainerResponse {
  Container container = 1;
}

message StreamLogsRequest {
  string containerId = 1;
  google.protobuf.Timestamp since = 2;
  int32 streamTypes = 3;
}

message StreamLogsResponse {
  LogEvent event = 1;
}

message LogsBetweenDatesRequest {
  string containerId = 1;
  google.protobuf.Timestamp since = 2;
  google.protobuf.Timestamp until = 3;
  int32 streamTypes = 4;
}

message StreamRawBytesRequest {
  string containerId = 1;
  google.protobuf.Timestamp since = 2;
  google.protobuf.Timestamp until = 3;
  int32 streamTypes = 4;
}
message StreamRawBytesResponse {
  bytes data = 1;
}

message StreamEventsRequest {}
message StreamEventsResponse {
  ContainerEvent event = 1;
}

message StreamStatsRequest {}
message StreamStatsResponse {
  ContainerStat stat = 1;
}

message HostInfoRequest {}

message HostInfoResponse {
  Host host = 1;
}

message StreamContainerStartedRequest {}
message StreamContainerStartedResponse {
  Container container = 1;
}

message ContainerActionRequest {
  string containerId = 1;
  ContainerAction action = 2;
}

message ContainerActionResponse {}

message UpdateContainerRequest {
  string containerId = 1;
  reserved 2;
  // source and runId are stamped on the new container (dev.dozzle.update-source
  // and dev.dozzle.update-run), so the update event says what started it.
  string source = 3;
  string runId = 4;
}

// RollbackContainerRequest swaps a container back to the image it ran before
// its last update. Progress streams with the same statuses as an update.
message RollbackContainerRequest {
  string containerId = 1;
  // toImageId, when set, must be the container's previous image: what the
  // server's UI showed. Empty takes the container's own target.
  string toImageId = 2;
  // expectedFromDigest refuses the rollback unless the container still runs
  // this digest (repo@sha256:... or sha256:...).
  string expectedFromDigest = 3;
}

message UpdateContainerProgress {
  string status = 1;
  string layer = 2;
  int64 current = 3;
  int64 total = 4;
  string error = 5;
}

message CheckImageUpdateRequest {
  string containerId = 1;
  bool force = 2;
}

message CheckImageUpdateResponse {
  string status = 1;
  string image = 2;
  string localDigest = 3;
  string remoteDigest = 4;
  int64 checkedAt = 5;
  string reason = 6;
}

message ContainerExecRequest {
  string containerId = 1;
  repeated string command = 2;
  oneof payload {
    bytes stdin = 3;
    ResizePayload resize = 4;
  }
}

message ResizePayload {
  uint32 width = 1;
  uint32 height = 2;
}

message ContainerExecResponse {
  bytes stdout = 1;
}

message ContainerAttachRequest {
  string containerId = 1;
  oneof payload {
    bytes stdin = 2;
    ResizePayload resize = 3;
  }
}

message ContainerAttachResponse {
  bytes stdout = 1;
}

message UpdateNotificationConfigRequest {
  repeated NotificationSubscription subscriptions = 1;
  repeated NotificationDispatcher dispatchers = 2;
}

message UpdateNotificationConfigResponse {}

message UpdateCloudConfigRequest {
  NotificationCloudConfig cloudConfig = 1;
}

message UpdateCloudConfigResponse {}

message GetNotificationStatsRequest {}

message GetNotificationStatsResponse {
  repeated NotificationSubscriptionStats stats = 1;
}

// Counted on the agent, next to the log, so only the buckets cross the wire.
message LogHistogramRequest {
  string containerId = 1;
  google.protobuf.Timestamp from = 2;
  google.protobuf.Timestamp to = 3;
  int64 widthSeconds = 4;
}

message LogHistogramResponse {
  repeated uint32 total = 1;
  repeated uint32 errors = 2;
  google.protobuf.Timestamp scannedFrom = 3;
  google.protobuf.Timestamp before = 4;
  google.protobuf.Timestamp after = 5;
}

// An update the agent saw on its own host: container.ContainerUpdateEvent.
// The agent keeps the record, so the server reads it rather than working
// updates out again from events.
message ContainerUpdateEvent {
  string host = 1;
  string name = 2;
  string engineName = 3;
  string oldId = 4;
  string newId = 5;
  string fromRef = 6;
  string toRef = 7;
  string fromDigest = 8;
  string toDigest = 9;
  string fromImageId = 10;
  string toImageId = 11;
  google.protobuf.Timestamp oldStartedAt = 12;
  google.protobuf.Timestamp at = 13;
  string source = 14;
  string runId = 15;
  bool rolledBack = 16;
}

message RecentUpdatesRequest {}

// The agent's kept update events, oldest first.
message RecentUpdatesResponse {
  repeated ContainerUpdateEvent events = 1;
}

message StreamUpdatesRequest {}

message StreamUpdatesResponse {
  ContainerUpdateEvent event = 1;
}
