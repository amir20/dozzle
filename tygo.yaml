# Generates assets/types/generated/ from the Go structs the HTTP API serialises.
# Run by `go generate` (main.go), checked by CI. Do not edit the output by hand:
# change the Go struct, or override one field with a `tstype:"..."` tag.
packages:
  - path: github.com/amir20/dozzle/internal/container
    output_path: assets/types/generated/container.ts
    include_files: [types.go, resources.go]
    type_mappings:
      time.Time: string
    # Shapes Go cannot express: the columnar stats MarshalJSON writes, and the
    # string unions Go keeps as plain strings.
    frontmatter: |
      import type { StatColumns, ContainerState, ContainerHealth } from "../Container";
  - path: github.com/amir20/dozzle/internal/web
    output_path: assets/types/generated/web.ts
    include_files: [inspect.go]
    # tygo turns a type from another Go package into `any`; map each one by hand.
    type_mappings:
      container.ContainerNetwork: container.ContainerNetwork
    frontmatter: |
      import type * as container from "./container";
