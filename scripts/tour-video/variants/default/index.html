<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: "JBM";
        src: url(../../../../node_modules/@fontsource-variable/jetbrains-mono/files/jetbrains-mono-latin-wght-normal.woff2)
          format("woff2");
        font-weight: 100 800;
      }
      :root {
        --bg: oklch(11% 0 0);
        --panel: oklch(18% 0 0);
        --text: oklch(92% 0 0);
        --muted: oklch(62% 0 0);
        --primary: oklch(70.96% 0.143 176.65);
        --secondary: oklch(81.38% 0.1448 90.1243);
        --error: oklch(64% 0.218 28.85);
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--bg);
      }
      body {
        font-family: -apple-system, "SF Pro Display", system-ui, sans-serif;
        color: var(--text);
        position: relative;
      }
      #glow {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(1200px 700px at 50% 110%, oklch(70.96% 0.143 176.65 / 0.1), transparent 70%),
          radial-gradient(900px 500px at 50% -20%, oklch(81% 0.14 90 / 0.05), transparent 70%);
      }
      .cap {
        position: absolute;
        top: 62px;
        left: 0;
        right: 0;
        text-align: center;
        font-size: 66px;
        font-weight: 700;
        letter-spacing: -0.02em;
        white-space: nowrap;
      }
      .cap span {
        display: inline-block;
        margin: 0 0.12em;
      }
      .cap .hl {
        color: var(--primary);
      }
      .win {
        position: absolute;
        left: 220px;
        top: 196px;
        width: 1480px;
        height: 832.5px;
        border-radius: 18px;
        overflow: hidden;
        border: 1px solid rgb(255 255 255 / 0.12);
        background: var(--panel);
        box-shadow:
          0 40px 120px rgb(0 0 0 / 0.6),
          0 0 0 1px rgb(0 0 0 / 0.4);
      }
      .zoom {
        position: absolute;
        inset: 0;
        transform-origin: 50% 50%;
      }
      .zoom img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: none;
      }
      .zoom img.on {
        display: block;
      }
      #hl {
        position: absolute;
        border: 3px solid var(--primary);
        border-radius: 8px;
        opacity: 0;
        box-shadow:
          0 0 0 9999px rgb(0 0 0 / 0.35),
          0 0 30px oklch(70.96% 0.143 176.65 / 0.5);
      }
      #term {
        background: #0b0b0b;
        font-family: "JBM", monospace;
      }
      #term .bar {
        height: 46px;
        border-bottom: 1px solid rgb(255 255 255 / 0.08);
        display: flex;
        align-items: center;
        padding: 0 18px;
        gap: 9px;
      }
      #term .dot {
        width: 13px;
        height: 13px;
        border-radius: 50%;
        background: #3a3a3a;
      }
      #term .title {
        flex: 1;
        text-align: center;
        color: #777;
        font-size: 16px;
        margin-right: 60px;
      }
      #tbody {
        position: absolute;
        top: 46px;
        left: 0;
        right: 0;
        bottom: 0;
        overflow: hidden;
        padding: 0 26px;
      }
      #lines {
        position: absolute;
        left: 26px;
        right: 26px;
        font-size: 19px;
        line-height: 30px;
        color: #8d8d8d;
        white-space: pre;
      }
      #prompt {
        position: absolute;
        left: 26px;
        right: 26px;
        top: 22px;
        font-size: 22px;
        line-height: 36px;
        color: #d6d6d6;
        white-space: pre-wrap;
      }
      #prompt .g {
        color: var(--primary);
      }
      #prompt .cur {
        display: inline-block;
        width: 12px;
        height: 26px;
        background: #d6d6d6;
        vertical-align: -5px;
      }
      #outro {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0;
      }
      #brand {
        display: flex;
        align-items: center;
        gap: 28px;
      }
      #brand img {
        width: 150px;
        height: 150px;
      }
      #brand .word {
        font-size: 132px;
        font-weight: 600;
        letter-spacing: -0.035em;
      }
      #tag {
        margin-top: 34px;
        font-size: 58px;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      #tag span {
        display: inline-block;
        margin: 0 0.12em;
      }
      #cmd {
        margin-top: 56px;
        font-family: "JBM", monospace;
        font-size: 34px;
        padding: 20px 34px;
        border-radius: 14px;
        border: 1px solid rgb(255 255 255 / 0.14);
        background: oklch(18% 0 0);
        color: var(--text);
      }
      #cmd .g {
        color: var(--primary);
      }
      #url {
        margin-top: 30px;
        font-family: "JBM", monospace;
        font-size: 30px;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <div id="glow"></div>

    <div class="win" id="term">
      <div class="bar">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="title">ssh prod-1</div>
      </div>
      <div id="tbody">
        <div id="lines"></div>
        <div id="prompt"></div>
      </div>
    </div>

    <div class="win" id="ui">
      <div class="zoom" id="zoom"><div id="hl"></div></div>
    </div>

    <div id="outro">
      <div id="brand">
        <img src="../../../../assets/logo.svg" />
        <div class="word">dozzle</div>
      </div>
      <div id="tag"></div>
      <div id="cmd"><span class="g">$</span> docker pull amir20/dozzle</div>
      <div id="url">dozzle.dev · open source</div>
    </div>

    <div class="cap" id="c1"></div>
    <div class="cap" id="c2"></div>
    <div class="cap" id="c3"></div>
    <div class="cap" id="c4"></div>

    <script>
      const $ = (s) => document.querySelector(s);
      const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
      const seg = (t, a, b) => clamp((t - a) / (b - a));
      const eo = (x) => 1 - Math.pow(1 - x, 3);
      const eio = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
      const pad = (i) => String(i).padStart(2, "0");

      // captions: [el, words, in, out]
      function mkCap(id, html) {
        const el = $(id);
        el.innerHTML = html
          .split(" ")
          .map((w) => `<span>${w.replace(/\*(.+)\*/, '<b class="hl" style="font-weight:700">$1</b>')}</span>`)
          .join("");
        return el;
      }
      const caps = [
        [mkCap("#c1", "Still reading Docker logs *like* *this?*"), 0.15, 4.3],
        [mkCap("#c2", "*Dozzle.* Live Docker logs in your browser."), 4.65, 6.95],
        [mkCap("#c3", "Find any container. Watch it *live.*"), 7.1, 11.45],
        [mkCap("#c4", "*SQL* over your logs. In the browser."), 11.75, 15.8],
      ];
      $("#tag").innerHTML = "Lightweight. No database. Just logs."
        .split(" ")
        .map((w) => `<span>${w}</span>`)
        .join("");
      function words(el, t, tin, tout, stagger = 0.06) {
        [...el.children].forEach((s, i) => {
          const a = eo(seg(t, tin + i * stagger, tin + i * stagger + 0.4));
          const o = seg(t, tout - 0.22, tout);
          s.style.opacity = a * (1 - o);
          s.style.transform = `translateY(${(1 - a) * 28 - o * 14}px)`;
          s.style.filter = `blur(${(1 - a) * 8}px)`;
        });
      }

      // terminal flood: raw docker logs -f output
      const paths = [
        "/api/cart",
        "/api/checkout",
        "/api/products",
        "/api/orders",
        "/health",
        "/api/users/me",
        "/api/search",
      ];
      const raw = [];
      for (let i = 1; i < 400; i++) {
        const ms = ((i * 37) % 180) + 4;
        if (i % 23 === 0)
          raw.push(
            `{"level":"error","msg":"payment provider timeout","path":"/api/checkout","status":504,"duration_ms":3001,"order_id":"ord_${8000 + i}"}`,
          );
        else if (i % 9 === 0) raw.push(`{"level":"warn","msg":"slow query","table":"orders","duration_ms":${ms * 6}}`);
        else
          raw.push(
            `{"level":"info","msg":"request completed","method":"GET","path":"${paths[i % 7]}","status":200,"duration_ms":${ms}}`,
          );
      }
      $("#lines").textContent = raw.join("\n");
      const CMD = "docker run -d -v /var/run/docker.sock:/var/run/docker.sock -p 8080:8080 amir20/dozzle";

      // screenshots
      const zoom = $("#zoom");
      const imgs = {};
      const names = [
        "home",
        "api",
        "search_00",
        "search_01",
        "search_02",
        "search_03",
        "search_04",
        "search_05",
        "search_06",
        "search_07",
      ];
      for (let i = 0; i < 24; i++) names.push("worker_" + pad(i));
      for (let i = 0; i <= 45; i++) names.push("sql_" + pad(i));
      for (const n of names) {
        const im = new Image();
        im.src = `../../work/shots/${n}.png`;
        zoom.insertBefore(im, $("#hl"));
        imgs[n] = im;
      }
      let cur = null;
      function show(n) {
        if (cur === n) return;
        if (cur) imgs[cur].classList.remove("on");
        imgs[n].classList.add("on");
        cur = n;
      }
      window.ready = Promise.all([
        document.fonts.ready,
        ...Object.values(imgs).map((i) => i.decode()),
        $("#brand img").decode(),
      ]);

      function frameName(t) {
        if (t < 7.2) return "home";
        if (t < 7.45) return "search_00";
        if (t < 8.45) return "search_" + pad(1 + Math.floor(seg(t, 7.45, 8.45) * 5.999));
        if (t < 8.95) return "search_07";
        if (t < 11.6) return "worker_" + pad(Math.min(23, Math.floor(seg(t, 8.95, 11.3) * 24)));
        if (t < 12.15) return "api";
        if (t < 12.45) return "sql_00";
        if (t < 13.85) return "sql_" + pad(1 + Math.floor(seg(t, 12.45, 13.85) * 43.999));
        return "sql_45";
      }

      window.setTime = (t) => {
        caps.forEach(([el, a, b]) => words(el, t, a, b));

        // terminal: visible 0 -> 4.6
        const term = $("#term");
        const tOut = eio(seg(t, 4.35, 4.65));
        term.style.opacity = 1 - tOut;
        term.style.transform = `scale(${1 - tOut * 0.03})`;
        const flood = t < 3.15;
        $("#lines").style.display = flood ? "block" : "none";
        $("#lines").style.top = `${-Math.pow(t + 0.6, 1.35) * 520}px`;
        const p = $("#prompt");
        if (flood) p.innerHTML = "";
        else {
          const n = Math.floor(seg(t, 3.3, 4.1) * CMD.length);
          let h = `<span class="g">$</span> docker logs -f checkout-api\n^C\n<span class="g">$</span> ${CMD.slice(0, n)}`;
          if (t > 4.15) h += `\n3f9c1e8a72b4\n<span class="g">→</span> http://localhost:8080`;
          p.innerHTML = h + (Math.floor(t * 3) % 2 || t < 4.15 ? '<span class="cur"></span>' : "");
        }

        // ui window
        const ui = $("#ui");
        const uin = eo(seg(t, 4.6, 5.15));
        const uout = eio(seg(t, 15.75, 16.1));
        ui.style.opacity = uin * (1 - uout);
        ui.style.transform = `translateY(${(1 - uin) * 60 + uout * 40}px) scale(${0.95 + uin * 0.05 - uout * 0.04})`;
        show(frameName(t));
        // dip between worker and sql scenes
        const dip = 1 - (seg(t, 11.45, 11.6) - seg(t, 11.62, 11.8));
        zoom.style.opacity = dip;
        // zooms
        let s = 1,
          ox = 50,
          oy = 50;
        const z3 = eio(seg(t, 10.2, 11.3)),
          z3o = seg(t, 11.45, 11.6);
        if (t < 11.6) {
          s = 1 + z3 * 0.3;
          ox = 55;
          oy = 100;
        } else {
          const z4 = eio(seg(t, 14.0, 14.7));
          s = 1 + z4 * 0.3;
          ox = 60;
          oy = 42;
        }
        zoom.style.transformOrigin = `${ox}% ${oy}%`;
        zoom.style.transform = `scale(${s})`;
        const hl = $("#hl");
        const h4 = eo(seg(t, 14.55, 14.9));
        hl.style.opacity = t > 13.85 ? h4 : 0;
        // /api/checkout row in sql_45 (normalized from capture)
        hl.style.left = "30.4%";
        hl.style.width = "68.2%";
        hl.style.top = "45.5%";
        hl.style.height = "4.8%";

        // outro
        const o = $("#outro");
        o.style.opacity = seg(t, 16.0, 16.3);
        const b = eo(seg(t, 16.05, 16.7));
        $("#brand").style.transform = `scale(${0.85 + b * 0.15})`;
        $("#brand").style.opacity = b;
        words($("#tag"), t, 16.55, 99, 0.12);
        const c = eo(seg(t, 17.3, 17.8));
        $("#cmd").style.opacity = c;
        $("#cmd").style.transform = `translateY(${(1 - c) * 20}px)`;
        const u = eo(seg(t, 17.6, 18.1));
        $("#url").style.opacity = u;
        $("#glow").style.opacity = 0.6 + 0.4 * Math.sin(t * 0.6);
      };
      // Read by render.mjs and build.sh: length in seconds and the settled frame used as the poster.
      window.meta = { duration: 20, poster: 15 };
      window.setTime(0);
    </script>
  </body>
</html>
