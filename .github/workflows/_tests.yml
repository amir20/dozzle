name: Tests

# Shared by test.yml (push/PR) and deploy.yml (tags). These jobs used to be
# copy-pasted between the two, which is how the go-test cache bug survived in
# one copy after being noticed in the other.

on:
  workflow_call:
    inputs:
      release-certs:
        description: Use the long-lived TTL certs from secrets instead of generating throwaway ones. Tag builds only.
        type: boolean
        default: false
      skip-staticcheck:
        description: Skip staticcheck. Tag builds set this so a lint failure cannot block a release, matching what deploy.yml gated on before these jobs were shared.
        type: boolean
        default: false
    secrets:
      TTL_KEY:
        required: false
      TTL_CERT:
        required: false

permissions:
  contents: read

jobs:
  npm-test:
    name: JavaScript Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The one job that still needs node. Every other script in package.json carries
      # `bun --bun` and runs on the bun runtime, but `test` and `typecheck` do not:
      # under --bun vitest's jsdom workers fail to start and vue-tsc reports a false
      # TS2614, so both run on node through their shebangs.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        name: Install Node
        with:
          node-version: latest
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run Typecheck
        run: bun run typecheck
      # Runs even when typecheck fails, so one job still reports both signals
      - name: Run Tests
        if: ${{ !cancelled() }}
        run: bun run test

  tailwind-lint:
    name: Tailwind Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # ESLint is here only for the Tailwind rules. See eslint.config.js.
      - name: Run ESLint
        run: bun run lint

  docs-translations:
    name: Docs Translations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      # There is no Crowdin or Weblate behind docs/, so an English page can change
      # and leave four translations quietly wrong. Each translated file records the
      # hash of the source it was written from; this fails when they diverge.
      - name: Check translations are in sync
        run: bun docs/scripts/check-translations.mjs

  go-test:
    name: Go Tests
    runs-on: ubuntu-latest
    steps:
      # Checkout must come first so setup-go can key its module/build cache on go.sum
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.1"
          check-latest: true
      - name: Run Go Tests with Coverage
        run: make test-ci

  staticcheck:
    name: Go Staticcheck
    runs-on: ubuntu-latest
    if: ${{ !inputs.skip-staticcheck }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.1"
          check-latest: true
          # This job shares a cache key with go-test (go version + go.sum hash) and
          # setup-go only writes on a miss. Staticcheck is much faster, so it always
          # won the race to populate, and its build cache has no -race artifacts in
          # it, which made the restore worthless for go-test. Let go-test own the key.
          cache: false
      - name: Generate dependencies
        run: make fake_assets shared_key.pem shared_cert.pem
      - name: Stactic checker
        uses: dominikh/staticcheck-action@9716614d4101e79b4340dd97b10e54d68234e431 # v1.4.1
        with:
          install-go: false

  int-test:
    name: Integration Tests
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # These images do not depend on the build, so fetch them while it runs
      # instead of after. The pull outlives this step; compose skips whatever
      # has landed by the time it starts and fetches the rest itself.
      - name: Pull test images in the background
        run: nohup docker compose pull --quiet playwright proxy logspam > /tmp/pull.log 2>&1 &
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Same cache-dance as dev.yml, see the note there. Without it the go build
      # runs on empty mounts and re-downloads and recompiles every dependency,
      # ~70s, and any frontend change invalidates that layer because dist is
      # copied in before it. The key is separate from dev.yml's: this job only
      # builds amd64, and whichever job saved a shared key first would own it.
      - name: Restore Go caches
        id: go-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            go-build-cache
            go-mod-cache
          key: go-int-${{ hashFiles('go.sum') }}
          restore-keys: go-int-
      - name: Inject Go caches into the builder
        uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723 # v3.4.0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          cache-map: |
            {
              "go-build-cache": "/root/.cache/go-build",
              "go-mod-cache": "/go/pkg/mod"
            }
          skip-extraction: ${{ steps.go-cache.outputs.cache-hit == 'true' }}
      - name: Generate certs
        if: ${{ !inputs.release-certs }}
        run: make shared_key.pem shared_cert.pem
      - name: Writing certs to file
        if: ${{ inputs.release-certs }}
        run: |
          echo "${{ secrets.TTL_KEY }}" > shared_key.pem
          echo "${{ secrets.TTL_CERT }}" > shared_cert.pem
      - name: Build
        uses: docker/bake-action@018cb6412ab401ebaa809aa5f85966b74628600f # v7.4.0
        with:
          source: .
          load: true
          set: |
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max
      - name: Run Playwright tests
        run: docker compose up --exit-code-from playwright
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
