name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@6fed3ca145920b639991cb756090506e1bcaf515 # v1.0.245
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this PR the way a careful maintainer would before merging.

            Dozzle is a widely deployed Docker log viewer. It runs next to the Docker socket,
            often exposed on a network, so auth, escaping, path handling and anything that
            reaches the Docker API matter more than usual. Backend is Go, frontend is Vue 3.

            Read the whole diff before judging it. `gh pr diff` can be long; if the output is
            truncated, use `git diff origin/${{ github.base_ref }}...HEAD -- <path>` one file at
            a time until you have seen every changed file. Open surrounding code with Read and
            Grep when a change depends on callers or callees outside the diff.

            Look for:
            1. Bugs and logic errors: wrong behavior, nil/undefined, races, leaked goroutines,
               unclosed streams, off-by-one, broken error paths.
            2. Security: auth or role bypass, XSS or missing escaping, path traversal, SSRF,
               secrets in logs, anything a remote user could trigger.
            3. Regressions: behavior an existing user relies on that silently changes.
            4. Performance on hot paths: log streaming, SSE fan-out, stats, the container store.
            5. Violations of rules in CLAUDE.md (translations in every locale, docs translations,
               design system, where files go, backend package boundaries).

            Do not suggest style changes, renames, speculative abstractions, extra validation
            against trusted internal code, or tests for trivial code. Zero findings is a fine
            outcome, but only after you have read every changed file.

            Posting:
            - Read existing inline threads with
              `gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments`
              and don't repeat anything already raised.
            - Post each line-specific finding as an inline comment with
              mcp__github_inline_comment__create_inline_comment: what breaks, under what input,
              and the fix if it is short.
            - Finish by writing the review into your tracking comment: a short heading naming
              the change, then a summary of what you checked and what you concluded, citing
              `file:line` for anything you verified. List findings that don't map to a line there.
              If nothing is wrong, say why you believe the change is correct, not just that it is.
          claude_args: |
            --model claude-opus-5-5
            --allowedTools "Read,Grep,Glob,mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments),Bash(git diff:*),Bash(git log:*),Bash(git show:*)"
