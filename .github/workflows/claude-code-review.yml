name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@cfc3eb22bfed5c26ef66e3223c982af27e4524de # v1.0.231
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          use_sticky_comment: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this PR for real defects only: bugs, regressions, security issues,
            and violations of rules in CLAUDE.md. Skip style, praise, and suggestions.

            - Read the diff with `gh pr diff`. Read existing feedback with `gh pr view --comments`
              and existing inline threads with
              `gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments`.
              Don't repeat anything already raised.
            - Post each line-specific finding as an inline comment with
              mcp__github_inline_comment__create_inline_comment. One or two sentences:
              what breaks and under what input.
            - Post a single summary with `gh pr comment` only for findings that don't
              map to a line. If there are no findings at all, say "No issues found."
              If every finding is inline, don't post a summary.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments)"
